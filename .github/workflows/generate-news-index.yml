name: Generate News Index

# Pages CMSがcontent/news/配下へcommitした際に、data/news-index.jsonを
# 自動生成・更新する。content/news/**以外の変更（＝このワークフロー自身が
# 作るdata/news-index.jsonへのcommitを含む）ではトリガーされないため、
# 自動commitによる無限ループは発生しない。

on:
  push:
    branches:
      - main
    paths:
      - "content/news/**"
  workflow_dispatch: {}

# data/news-index.jsonをmainへpushするために必要な最小限の権限のみ付与
permissions:
  contents: write

# content/news/への連続pushで実行が重なった場合に、commit競合が起きないよう直列化する
concurrency:
  group: news-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-news-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate data/news-index.json
        run: node scripts/generate-news-index.js

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- data/news-index.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push data/news-index.json
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news-index.json
          git commit -m "chore: update news index [skip ci]"
          git push

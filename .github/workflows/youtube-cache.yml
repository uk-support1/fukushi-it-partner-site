name: YouTube Cache

# Refreshes data/youtube-cache.json on a GitHub cloud runner, once a day before
# Daily Blog. Each run folds the previous cache back in and keeps up to 30 days
# of videos, so unused videos accumulate (a channel feed only lists ~15 videos).
# It used to run on a self-hosted home PC because the cloud was being 404/500'd
# by YouTube; the cloud was verified working again on 2026-10-06, so no PC is
# needed any more. If YouTube blocks the cloud again, a total fetch failure
# fails this run WITHOUT overwriting the cache, and Daily Blog falls back to
# its normal evergreen topic. Best-effort and decoupled from Daily Blog: it must
# never share Daily Blog's concurrency group.

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: youtube-cache
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch the 4 YouTube channels and commit the cache if changed
        run: node scripts/fetch-youtube-cache.js

name: Daily Blog

on:
  schedule:
    # UTC 21:00 = next day 06:00 Asia/Tokyo. GitHub may delay scheduled runs.
    - cron: '0 21 * * *'
  workflow_dispatch: {}

# Draft creation only: no commit, push or deployment permissions.
permissions:
  contents: read

concurrency:
  group: daily-blog-main
  cancel-in-progress: false

jobs:
  start:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test topic selection with mocked API
        run: node --test tests/daily-topic.test.js
      - name: Select today's topic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/daily-blog.js
      - name: Verify only one draft Markdown was created
        shell: bash
        run: |
          if [ -n "$(git diff --name-only)" ]; then
            echo 'Tracked repository files changed unexpectedly; stopping.' >&2
            exit 1
          fi
          mapfile -t new_files < <(git ls-files --others --exclude-standard)
          if [ "${#new_files[@]}" -ne 1 ] || [[ "${new_files[0]}" != content/articles/*.md ]]; then
            echo 'Expected exactly one new draft under content/articles; stopping.' >&2
            printf 'New file: %s\n' "${new_files[@]}" >&2
            exit 1
          fi

      # Future: persist the validated draft, then run build/artifact/deploy in this
      # workflow. Do not rely on a GITHUB_TOKEN push starting Generate Blog.

name: Daily Blog

on:
  schedule:
    # UTC 21:00 = next day 06:00 Asia/Tokyo. GitHub may delay scheduled runs.
    - cron: '0 21 * * *'
  workflow_dispatch: {}

# Topic selection only: no repository writes or deployment permissions.
permissions:
  contents: read

concurrency:
  group: daily-blog-main
  cancel-in-progress: false

jobs:
  start:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test topic selection with mocked API
        run: node --test tests/daily-topic.test.js
      - name: Select today's topic
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node scripts/daily-blog.js
      - name: Verify no repository files were changed
        if: always()
        shell: bash
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo 'Unexpected repository changes; stopping.' >&2
            exit 1
          fi

      # Future: after validated article creation, run build/artifact/deploy in
      # this workflow. Do not rely on a GITHUB_TOKEN push starting Generate Blog.

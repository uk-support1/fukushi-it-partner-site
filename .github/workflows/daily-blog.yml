name: Daily Blog

on:
  schedule:
    # UTC 21:00 = next day 06:00 Asia/Tokyo. GitHub may delay scheduled runs.
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      continuous_trial:
        description: '2026-09-12だけ、公開完了後に30分間隔で自動継続する'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  start:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run tests with mocked APIs and local Git remotes
        run: npm test
      - name: Select today's topic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DAILY_BLOG_RESULT_FILE: ${{ runner.temp }}/daily-blog-result.json
        run: node scripts/daily-blog.js
      - name: Commit and push only the generated draft
        env:
          DAILY_BLOG_RESULT_FILE: ${{ runner.temp }}/daily-blog-result.json
          DAILY_DRAFT_COMMIT_RESULT_FILE: ${{ runner.temp }}/daily-draft-commit-result.json
        run: node scripts/commit-draft.js
      - name: Publish and push only the generated article
        env:
          DAILY_BLOG_RESULT_FILE: ${{ runner.temp }}/daily-blog-result.json
          DAILY_DRAFT_COMMIT_RESULT_FILE: ${{ runner.temp }}/daily-draft-commit-result.json
        run: node scripts/publish-draft.js
      - name: Prepare public files only
        run: node scripts/prepare-pages.js "$RUNNER_TEMP/fukushi-pages"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/fukushi-pages

  deploy:
    needs: start
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report publication success
        run: echo '{"status":"published","articlesCreated":1,"shouldPublish":true}'

  continue-trial:
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.continuous_trial == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: write
    steps:
      - name: Wait until 30 minutes after this run started and continue before deadline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline_epoch=$(date -u -d '2026-09-12 14:40:00Z' +%s)
          run_started_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          started_epoch=$(date -u -d "$run_started_at" +%s)
          next_epoch=$((started_epoch + 1800))
          if (( next_epoch > deadline_epoch )); then
            echo 'Trial deadline reached; no next run will be created.'
            exit 0
          fi
          now_epoch=$(date -u +%s)
          if (( next_epoch > now_epoch )); then
            sleep $((next_epoch - now_epoch))
          fi
          if (( $(date -u +%s) <= deadline_epoch )); then
            gh workflow run daily-blog.yml --repo "$GITHUB_REPOSITORY" --ref main -f continuous_trial=true
          fi

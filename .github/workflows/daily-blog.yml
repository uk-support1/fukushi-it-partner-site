name: Daily Blog

on:
  schedule:
    # UTC 21:00 = next day 06:00 Asia/Tokyo. GitHub may delay scheduled runs.
    - cron: '0 21 * * *'
  workflow_dispatch: {}

# Draft creation and one-file persistence only. No deployment permissions.
permissions:
  contents: write

concurrency:
  group: daily-blog-main
  cancel-in-progress: false

jobs:
  start:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test topic selection with mocked API
        run: node --test tests/daily-topic.test.js
      - name: Select today's topic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DAILY_BLOG_RESULT_FILE: ${{ runner.temp }}/daily-blog-result.json
        run: node scripts/daily-blog.js
      - name: Commit and push only the generated draft
        env:
          DAILY_BLOG_RESULT_FILE: ${{ runner.temp }}/daily-blog-result.json
        run: node scripts/commit-draft.js

      # Future: run build/artifact/deploy in this
      # workflow. Do not rely on a GITHUB_TOKEN push starting Generate Blog.

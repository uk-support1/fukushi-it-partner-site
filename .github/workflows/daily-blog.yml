name: Daily Blog

on:
  schedule:
    # UTC 21:17 = next day 06:17 Asia/Tokyo. GitHub may delay scheduled runs.
    - cron: '17 21 * * *'
    # Backup: UTC 0:17 = 09:17 Asia/Tokyo. GitHub silently dropped the primary
    # firing above on 2026-09-22, 09-23 and 09-24 in production (no run at all,
    # not just a delay). daily-blog.js skips this firing as a no-op whenever
    # today's article already exists, so it never creates a second one.
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      continuous_trial:
        description: '2026-09-12だけ、公開完了後に30分間隔で自動継続する'
        required: false
        type: boolean
        default: false
      sources_filter:
        description: 'YouTubeの取得方法（動作確認用。通常はautoのまま。auto=直接取得+キャッシュ、cache=キャッシュのみ、live=直接取得のみ）'
        required: false
        type: choice
        options:
          - auto
          - cache
          - live
        default: auto
      simulate_failure:
        description: '失敗通知の動作確認用。trueにすると、記事を作らず最初のステップで意図的に失敗させ、失敗通知（Issue）が作られるかを確認する'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  start:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 重複確認を16件ずつの複数回に分けたぶん（および不完全な応答の再試行ぶん）、Gemini APIの呼び出しが増えるため10分にしている。
    timeout-minutes: 10
    outputs:
      status: ${{ steps.select-topic.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          # Preserve same-day creation order for the last ten editorial comparisons.
          fetch-depth: 0
      - name: Simulated failure (notification test only)
        if: inputs.simulate_failure == true
        run: |
          echo "::error title=通知テスト::失敗通知の動作確認のため、意図的に失敗させました（記事は作られません）"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run tests with mocked APIs and local Git remotes
        run: npm test
      - name: Select today's topic
        id: select-topic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DAILY_BLOG_RESULT_FILE: ${{ runner.temp }}/daily-blog-result.json
          DAILY_BLOG_SOURCES_FILTER: ${{ inputs.sources_filter }}
          DAILY_BLOG_EVENT_NAME: ${{ github.event_name }}
        run: |
          node scripts/daily-blog.js
          echo "status=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.env.DAILY_BLOG_RESULT_FILE,"utf8")).status)')" >> "$GITHUB_OUTPUT"
      - name: Commit and push only the generated draft
        if: steps.select-topic.outputs.status == 'draft_saved'
        env:
          DAILY_BLOG_RESULT_FILE: ${{ runner.temp }}/daily-blog-result.json
          DAILY_DRAFT_COMMIT_RESULT_FILE: ${{ runner.temp }}/daily-draft-commit-result.json
        run: node scripts/commit-draft.js
      - name: Publish and push only the generated article
        if: steps.select-topic.outputs.status == 'draft_saved'
        env:
          DAILY_BLOG_RESULT_FILE: ${{ runner.temp }}/daily-blog-result.json
          DAILY_DRAFT_COMMIT_RESULT_FILE: ${{ runner.temp }}/daily-draft-commit-result.json
        run: node scripts/publish-draft.js
      - name: Prepare public files only
        if: steps.select-topic.outputs.status == 'draft_saved'
        run: node scripts/prepare-pages.js "$RUNNER_TEMP/fukushi-pages"
      - uses: actions/upload-pages-artifact@v4
        if: steps.select-topic.outputs.status == 'draft_saved'
        with:
          path: ${{ runner.temp }}/fukushi-pages

  deploy:
    needs: start
    if: needs.start.outputs.status == 'draft_saved'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report publication success
        run: echo '{"status":"published","articlesCreated":1,"shouldPublish":true}'

  continue-trial:
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.continuous_trial == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: write
    steps:
      - name: Wait until 30 minutes after this run started and continue before deadline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline_epoch=$(date -u -d '2026-09-12 14:40:00Z' +%s)
          next_epoch=$(($(date -u +%s) + 1800))
          if (( next_epoch > deadline_epoch )); then
            echo 'Trial deadline reached; no next run will be created.'
            exit 0
          fi
          now_epoch=$(date -u +%s)
          if (( next_epoch > now_epoch )); then
            sleep $((next_epoch - now_epoch))
          fi
          if (( $(date -u +%s) <= deadline_epoch )); then
            gh workflow run daily-blog.yml --repo "$GITHUB_REPOSITORY" --ref main -f continuous_trial=true
          fi

  # ---- 失敗通知：start / deploy のどちらかが失敗したら、GitHub Issue を作って管理者へ知らせる ----
  # 公開処理（start・deploy）の後に動く別ジョブなので、通知に失敗しても記事の公開には影響しない。
  notify-failure:
    needs: [start, deploy]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_SIMULATED: ${{ inputs.simulate_failure == true }}
        run: node scripts/notify-workflow-failure.js failure

  # ---- 復旧：自動投稿が成功したら、開いている失敗Issueを閉じる（開いていなければ何もしない） ----
  recover-failure-issue:
    needs: [start, deploy]
    if: ${{ always() && needs.start.result == 'success' && needs.deploy.result != 'failure' && needs.deploy.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Close the failure issue if one is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/notify-workflow-failure.js recover

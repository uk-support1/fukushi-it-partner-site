name: Daily Blog

on:
  schedule:
    # UTC 21:17 = next day 06:17 Asia/Tokyo. GitHub may delay scheduled runs.
    - cron: '17 21 * * *'
    # Backup: UTC 0:17 = 09:17 Asia/Tokyo. GitHub silently dropped the primary
    # firing above on 2026-09-22, 09-23 and 09-24 in production (no run at all,
    # not just a delay). daily-blog.js skips this firing as a no-op whenever
    # today's article already exists, so it never creates a second one.
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      continuous_trial:
        description: '2026-09-12だけ、公開完了後に30分間隔で自動継続する'
        required: false
        type: boolean
        default: false
      sources_filter:
        description: 'YouTubeの取得方法（動作確認用。通常はcacheのまま）'
        required: false
        type: choice
        options:
          - cache
          - live
        default: cache

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  start:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.select-topic.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          # Preserve same-day creation order for the last ten editorial comparisons.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run tests with mocked APIs and local Git remotes
        run: npm test
      - name: Select today's topic
        id: select-topic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DAILY_BLOG_RESULT_FILE: ${{ runner.temp }}/daily-blog-result.json
          DAILY_BLOG_SOURCES_FILTER: ${{ inputs.sources_filter }}
          DAILY_BLOG_EVENT_NAME: ${{ github.event_name }}
        run: |
          node scripts/daily-blog.js
          echo "status=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.env.DAILY_BLOG_RESULT_FILE,"utf8")).status)')" >> "$GITHUB_OUTPUT"
      - name: Commit and push only the generated draft
        if: steps.select-topic.outputs.status == 'draft_saved'
        env:
          DAILY_BLOG_RESULT_FILE: ${{ runner.temp }}/daily-blog-result.json
          DAILY_DRAFT_COMMIT_RESULT_FILE: ${{ runner.temp }}/daily-draft-commit-result.json
        run: node scripts/commit-draft.js
      - name: Publish and push only the generated article
        if: steps.select-topic.outputs.status == 'draft_saved'
        env:
          DAILY_BLOG_RESULT_FILE: ${{ runner.temp }}/daily-blog-result.json
          DAILY_DRAFT_COMMIT_RESULT_FILE: ${{ runner.temp }}/daily-draft-commit-result.json
        run: node scripts/publish-draft.js
      - name: Prepare public files only
        if: steps.select-topic.outputs.status == 'draft_saved'
        run: node scripts/prepare-pages.js "$RUNNER_TEMP/fukushi-pages"
      - uses: actions/upload-pages-artifact@v4
        if: steps.select-topic.outputs.status == 'draft_saved'
        with:
          path: ${{ runner.temp }}/fukushi-pages

  deploy:
    needs: start
    if: needs.start.outputs.status == 'draft_saved'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report publication success
        run: echo '{"status":"published","articlesCreated":1,"shouldPublish":true}'

  continue-trial:
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.continuous_trial == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: write
    steps:
      - name: Wait until 30 minutes after this run started and continue before deadline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline_epoch=$(date -u -d '2026-09-12 14:40:00Z' +%s)
          next_epoch=$(($(date -u +%s) + 1800))
          if (( next_epoch > deadline_epoch )); then
            echo 'Trial deadline reached; no next run will be created.'
            exit 0
          fi
          now_epoch=$(date -u +%s)
          if (( next_epoch > now_epoch )); then
            sleep $((next_epoch - now_epoch))
          fi
          if (( $(date -u +%s) <= deadline_epoch )); then
            gh workflow run daily-blog.yml --repo "$GITHUB_REPOSITORY" --ref main -f continuous_trial=true
          fi

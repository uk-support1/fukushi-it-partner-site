name: Generate Blog

# Pages CMSがcontent/articles/配下へcommitした際に、
# data/blog-index.json・blog/<slug>.html・blog.html・sitemap.xmlを
# 自動生成・更新する。
# content/articles/**以外の変更（＝このワークフロー自身が作る生成物への
# commitを含む）ではトリガーされないため、自動commitによる無限ループは
# 発生しない（generate-news-index.ymlと同じ設計）。

on:
  push:
    branches:
      - main
    paths:
      - "content/articles/**"
  workflow_dispatch: {}

# 生成物をmainへpushするために必要な最小限の権限のみ付与
permissions:
  contents: write

# content/articles/への連続pushで実行が重なった場合に、commit競合が起きないよう直列化する
concurrency:
  group: generate-blog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate blog-index.json / blog/*.html / blog.html / sitemap.xml
        run: node scripts/generate-blog.js

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- data/blog-index.json blog blog.html sitemap.xml)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push generated files
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/blog-index.json blog blog.html sitemap.xml
          git commit -m "chore: update blog articles [skip ci]"
          git push

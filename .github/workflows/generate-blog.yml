name: Generate Blog

# All main pushes also deploy non-blog pages after switching Pages to Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: '失敗通知の動作確認用。trueにすると、生成・公開より前の最初のステップで意図的に失敗させ、失敗通知（Issue）が作られるかを確認する（サイトは変更・公開されない）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-blog:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Simulated failure (notification test only)
        if: inputs.simulate_failure == true
        run: |
          echo "::error title=通知テスト::失敗通知の動作確認のため、意図的に失敗させました（サイトは変更・公開されません）"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          # CMS edits intentionally differ from the previous generated files.
          BLOG_BASELINE_COMPARE: "0"
      - run: node scripts/generate-blog.js
      # Abort on concurrent CMS/manual edits; never force-push over them.
      - name: Check current main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Commit generated files only
        run: |
          git add -- data/blog-index.json blog blog.html sitemap.xml
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: update blog articles [skip ci]'
            git push origin HEAD:main
          fi
      - name: Prepare public files only
        run: node scripts/prepare-pages.js "$RUNNER_TEMP/fukushi-pages"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/fukushi-pages

  deploy:
    needs: build-blog
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v4

  # ---- 失敗通知：build-blog（テスト・生成を含む）または deploy が失敗したら、GitHub Issue を作って管理者へ知らせる ----
  # 画像の重複などによる npm test の失敗もここで通知される。
  # 公開処理の後に動く別ジョブなので、通知に失敗してもサイトの公開には影響しない。
  notify-failure:
    needs: [build-blog, deploy]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_SIMULATED: ${{ inputs.simulate_failure == true }}
        run: node scripts/notify-workflow-failure.js failure

  # ---- 復旧：公開まで成功したら、開いている失敗Issueを閉じる（開いていなければ何もしない） ----
  recover-failure-issue:
    needs: [build-blog, deploy]
    if: ${{ always() && needs.build-blog.result == 'success' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Close the failure issue if one is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/notify-workflow-failure.js recover

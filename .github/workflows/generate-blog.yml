name: Generate Blog

# All main pushes also deploy non-blog pages after switching Pages to Actions.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-blog:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          # CMS edits intentionally differ from the previous generated files.
          BLOG_BASELINE_COMPARE: "0"
      - run: node scripts/generate-blog.js
      # Abort on concurrent CMS/manual edits; never force-push over them.
      - name: Check current main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Commit generated files only
        run: |
          git add -- data/blog-index.json blog blog.html sitemap.xml
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: update blog articles [skip ci]'
            git push origin HEAD:main
          fi
      - name: Prepare public files only
        run: node scripts/prepare-pages.js "$RUNNER_TEMP/fukushi-pages"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/fukushi-pages

  deploy:
    needs: build-blog
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>05 ご利用の流れ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .h1 { font-size: 64px; }
  .flow { margin-top: 70px; display: flex; align-items: flex-start; justify-content: space-between; position: relative; }
  .flow::before {
    content: ""; position: absolute; left: 70px; right: 70px; top: 74px; height: 6px; background: var(--green-100); border-radius: 3px;
  }
  .step { position: relative; width: 226px; text-align: center; }
  .step .ico { position: relative; width: 150px; height: 150px; margin: 0 auto; box-shadow: 0 0 0 10px var(--bg); }
  .step .ic { width: 76px; height: 76px; }
  .step .no {
    position: absolute; left: -2px; top: -4px; width: 46px; height: 46px; border-radius: 50%;
    background: var(--green-900); color: var(--white); font-size: 28px; font-weight: 800; line-height: 46px;
  }
  .step .lb { margin-top: 24px; font-size: 36px; font-weight: 800; line-height: 1.35; color: var(--green-900); }
  .step.opt .lb { color: var(--orange-600); }
  .step.opt .ico { border: 4px dashed var(--orange-500); }
  .step.opt .no { background: var(--orange-600); }
  .step .nt { margin-top: 8px; font-size: 27px; color: var(--text-600); font-weight: 500; line-height: 1.4; }
  .assure {
    margin-top: 64px; display: flex; align-items: center; gap: 22px;
    background: var(--green-100); border-radius: 24px; padding: 26px 34px;
  }
  .assure .ic { width: 56px; height: 56px; color: var(--green-700); flex: none; }
  .assure .t { font-size: 36px; font-weight: 800; color: var(--green-900); line-height: 1.4; }
</style>
</head>
<body>
<script src="icons.js"></script>
<div class="canvas">
  <p class="eyebrow">ご利用の流れ</p>
  <p class="h1">むずかしい操作は、<em>ありません</em></p>

  <div class="flow">
    <div class="step"><span class="ico g"><svg class="ic"><use href="#i-chat"/></svg><span class="no">1</span></span>
      <p class="lb">ご相談<br>ご注文</p></div>
    <div class="step"><span class="ico g"><svg class="ic"><use href="#i-camera"/></svg><span class="no">2</span></span>
      <p class="lb">画面の写真を<br>送る</p></div>
    <div class="step"><span class="ico g"><svg class="ic"><use href="#i-doc"/></svg><span class="no">3</span></span>
      <p class="lb">報告書を<br>お届け</p></div>
    <div class="step opt"><span class="ico o"><svg class="ic"><use href="#i-update"/></svg><span class="no">4</span></span>
      <p class="lb">更新は<br>必要な方だけ</p><p class="nt">オプション</p></div>
  </div>

  <div class="assure"><svg class="ic"><use href="#i-lock"/></svg><p class="t">ログイン情報は不要。<br>画面が見つからなくても大丈夫です。</p></div>

  <div class="brand"><img src="../../../../assets/images/logo-mark.png" alt=""><span>福祉ITパートナー</span></div>
</div>
</body>
</html>

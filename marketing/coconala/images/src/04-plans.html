<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>04 料金とプラン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .plans { margin-top: 34px; list-style: none; display: flex; flex-direction: column; gap: 18px; }
  .plan { display: flex; align-items: center; gap: 26px; padding: 20px 34px 20px 26px; }
  .plan .ico { width: 92px; height: 92px; }
  .plan .ic { width: 50px; height: 50px; }
  .plan .body { flex: 1; min-width: 0; }
  .plan .nm { font-size: 38px; font-weight: 800; color: var(--green-900); line-height: 1.3; }
  .plan .ds { margin-top: 2px; font-size: 27px; font-weight: 500; color: var(--text-600); line-height: 1.45; }
  .plan .pr { flex: none; font-size: 68px; font-weight: 800; color: var(--green-900); letter-spacing: -.01em; white-space: nowrap; }
  .plan .pr small { font-size: 32px; font-weight: 800; }
  .plan.third { background: var(--bg); border: 4px dashed var(--orange-500); box-shadow: none; }
  .tag {
    display: inline-block; margin-bottom: 4px; background: var(--orange-100); color: var(--orange-600);
    font-size: 22px; font-weight: 800; border-radius: 999px; padding: 2px 16px;
  }
  .foot { margin-top: 28px; font-size: 32px; font-weight: 700; color: var(--green-700); }
</style>
</head>
<body>
<script src="icons.js"></script>
<div class="canvas">
  <p class="eyebrow">すべて税込</p>
  <p class="h1">料金とプラン</p>

  <ul class="plans">
    <li class="card plan">
      <span class="ico gd"><svg class="ic"><use href="#i-search"/></svg></span>
      <div class="body"><p class="nm">① 基本プラン</p><p class="ds">確認して、報告書でお届け</p><p class="ds">※更新作業は含みません</p></div>
      <p class="pr"><span data-basic>2,000</span><small>円</small></p>
    </li>
    <li class="card plan">
      <span class="ico od"><svg class="ic"><use href="#i-update"/></svg></span>
      <div class="body"><p class="nm">② 更新オプション</p><p class="ds">バックアップ・更新・動作確認</p><p class="ds">※不具合の修正は別途お見積り</p></div>
      <p class="pr">＋5,000<small>円</small></p>
    </li>
    <li class="card plan third">
      <span class="ico g"><svg class="ic"><use href="#i-site"/></svg></span>
      <div class="body"><span class="tag">必要な方だけ</span><p class="nm">③ サイト乗り換え</p><p class="ds">「見積り相談」からご案内します</p></div>
      <p class="pr">49,500<small>円〜</small></p>
    </li>
  </ul>
  <p class="foot">更新も乗り換えも、必要な方だけでOK。</p>

  <div class="brand"><img src="../../../../assets/images/logo-mark.png" alt=""><span>福祉ITパートナー</span></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const basic = q.get('basic') || '2,000';
  document.querySelectorAll('[data-basic]').forEach(e => e.textContent = basic);
</script>
</body>
</html>

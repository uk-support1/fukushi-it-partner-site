<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>03 結果は4段階</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .grid { margin-top: 46px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .st { display: flex; align-items: center; gap: 22px; padding: 28px 24px 28px 26px; min-height: 220px; }
  .st .ico { width: 100px; height: 100px; }
  .st .ic { width: 54px; height: 54px; }
  .st .lb { font-size: 40px; font-weight: 800; line-height: 1.25; color: var(--c); }
  .st .cp { margin-top: 6px; font-size: 29px; font-weight: 500; color: var(--text-600); line-height: 1.4; }
  .ok { --c: var(--st-ok); } .up { --c: var(--st-update); } .eol { --c: var(--st-eol); } .chk { --c: var(--st-check); }
  .fine { margin-top: 36px; font-size: 28px; color: var(--text-600); font-weight: 500; }
</style>
</head>
<body>
<script src="icons.js"></script>
<div class="canvas">
  <p class="eyebrow">報告書（PDF）でお届け</p>
  <p class="h1">結果は、<em>4段階</em>でお知らせ</p>

  <div class="grid">
    <div class="card st ok"><span class="ico g"><svg class="ic"><use href="#i-shield-check"/></svg></span>
      <div><p class="lb">対応済み</p><p class="cp">修正版以上の番号です</p></div></div>
    <div class="card st up"><span class="ico o"><svg class="ic"><use href="#i-update"/></svg></span>
      <div><p class="lb">更新が必要</p><p class="cp">修正版より前の番号です</p></div></div>
    <div class="card st eol"><span class="ico r"><svg class="ic"><use href="#i-alert"/></svg></span>
      <div><p class="lb">サポート終了</p><p class="cp">公式の更新が出ない版</p></div></div>
    <div class="card st chk"><span class="ico s"><svg class="ic"><use href="#i-question"/></svg></span>
      <div><p class="lb">要確認</p><p class="cp">確認先をご案内します</p></div></div>
  </div>
  <p class="fine">PHPを使っていないサイトは「対象外」とお伝えします。</p>

  <div class="brand"><img src="../../../../assets/images/logo-mark.png" alt=""><span>福祉ITパートナー</span></div>
</div>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>01 メイン画像</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .canvas { background: var(--cream-100); }
  .band { position: absolute; left: 0; top: 0; width: 1220px; height: 12px; background: var(--green-700); }
  .blob {
    position: absolute; right: -150px; top: 214px; width: 620px; height: 620px; border-radius: 50%;
    background: var(--green-100);
  }
  .mascot { right: 44px; top: 176px; width: 480px; }
  .main-copy { margin-top: 38px; position: relative; z-index: 2; width: 760px; }
  .main-copy .t1 { font-size: 112px; font-weight: 800; color: var(--green-900); line-height: 1.1; letter-spacing: .01em; }
  .main-copy .t2 { margin-top: 12px; font-size: 62px; font-weight: 800; color: var(--orange-600); line-height: 1.3; }
  .main-copy .t3 { margin-top: 20px; font-size: 38px; font-weight: 700; color: var(--text-900); line-height: 1.45; }
  .checks { margin-top: 34px; list-style: none; position: relative; z-index: 2; }
  .checks li {
    display: flex; align-items: center; gap: 16px;
    font-size: 36px; font-weight: 700; color: var(--green-900); margin-bottom: 14px;
  }
  .checks .tick {
    flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--green-700);
    color: var(--white); font-size: 30px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
  .price {
    position: absolute; right: 102px; bottom: 116px; z-index: 3;
    width: 270px; height: 270px; border-radius: 50%;
    background: var(--orange-600); color: var(--white);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 10px 28px rgba(217,127,63,.35);
    transform: rotate(-6deg);
  }
  .price .a { font-size: 32px; font-weight: 700; }
  .price .b { font-size: 80px; font-weight: 800; line-height: 1.05; letter-spacing: -.01em; }
  .price .b small { font-size: 38px; font-weight: 800; margin-left: 2px; }
  .price .c { font-size: 26px; font-weight: 700; margin-top: 4px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="band"></div>
  <div class="blob"></div>
  <img class="mascot" src="../../../../assets/images/buhio/buhio-03-pointing.png" alt="">
  <p class="kicker">福祉事業所・小規模事業者の方へ</p>
  <div class="main-copy">
    <p class="t1">PHP脆弱性</p>
    <p class="t2">うちのサイトは対象？</p>
    <p class="t3">確認して、<br>やさしい言葉でご報告します</p>
  </div>
  <ul class="checks">
    <li><span class="tick">✓</span>ログイン情報は不要</li>
    <li><span class="tick">✓</span>専門知識は不要</li>
    <li><span class="tick">✓</span>更新は、必要な方だけ</li>
  </ul>
  <div class="price">
    <span class="a">確認だけ</span>
    <span class="b"><span data-basic>2,000</span><small>円</small></span>
    <span class="c">（税込）</span>
  </div>
  <div class="brand"><img src="../../../../assets/images/logo-mark.png" alt=""><span>福祉ITパートナー</span><span class="sub">売り込みはしません</span></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const basic = q.get('basic') || '2,000';
  document.querySelectorAll('[data-basic]').forEach(e => e.textContent = basic);
</script>
</body>
</html>

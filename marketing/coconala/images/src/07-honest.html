<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>07 売り込みはしません</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .h1 { font-size: 96px; line-height: 1.2; margin-top: 44px; }
  .h1 em { font-style: normal; color: #ffc89a; }
  .shield { position: absolute; right: 102px; top: 170px; width: 270px; height: 270px; color: var(--white); }
  .shield .ic { width: 270px; height: 270px; stroke-width: 3.2; }
  .promises { margin-top: 104px; list-style: none; position: relative; z-index: 2; }
  .promises li { display: flex; align-items: center; gap: 22px; font-size: 44px; font-weight: 700; margin-bottom: 34px; line-height: 1.35; }
  .promises .ico { width: 66px; height: 66px; background: var(--orange-500); color: var(--white); }
  .promises .ic { width: 36px; height: 36px; stroke-width: 5; }
</style>
</head>
<body>
<script src="icons.js"></script>
<div class="canvas dark">
  <p class="eyebrow">福祉ITパートナーのお約束</p>
  <p class="h1">売り込みは、<br><em>しません。</em></p>
  <div class="shield decor"><svg class="ic"><use href="#i-shield-check"/></svg></div>

  <ul class="promises">
    <li><span class="ico"><svg class="ic"><use href="#i-check"/></svg></span>更新が不要なら、不要とお伝えします</li>
    <li><span class="ico"><svg class="ic"><use href="#i-check"/></svg></span>乗り換えは、必要な方にだけ</li>
    <li><span class="ico"><svg class="ic"><use href="#i-check"/></svg></span>むずかしい言葉は、使いません</li>
  </ul>

  <div class="brand"><img src="../../../../assets/images/logo-mark.png" alt=""><span>福祉ITパートナー</span><span class="sub">福祉事業所・団体専門</span></div>
</div>
</body>
</html>

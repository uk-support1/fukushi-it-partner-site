<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>03 ご報告は4段階</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .head { display: flex; flex-direction: column; gap: 14px; }
  .h1 { font-size: 58px; }
  .grid { margin-top: 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .st { padding: 22px 24px 22px; position: relative; border-top: 10px solid var(--c); }
  .st .top { display: flex; align-items: center; gap: 16px; }
  .st .sym {
    flex: none; width: 70px; height: 70px; border-radius: 50%; background: var(--c); color: var(--white);
    font-size: 44px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
  .st .lb { font-size: 38px; font-weight: 800; color: var(--c); line-height: 1.25; }
  .st .ds { margin-top: 12px; font-size: 30px; font-weight: 500; color: var(--text-900); line-height: 1.5; }
  .ok { --c: var(--st-ok); } .up { --c: var(--st-update); } .eol { --c: var(--st-eol); } .chk { --c: var(--st-check); }
  .vers {
    margin-top: 18px; background: var(--green-100); border-radius: 20px; padding: 14px 26px;
    display: flex; align-items: baseline; gap: 18px; flex-wrap: nowrap;
  }
  .vers .k { font-size: 28px; font-weight: 700; color: var(--green-900); white-space: nowrap; }
  .vers .v { font-size: 34px; font-weight: 800; color: var(--green-900); letter-spacing: .01em; white-space: nowrap; }
  .fine { margin-top: 10px; font-size: 25px; color: var(--text-600); }
</style>
</head>
<body>
<div class="canvas">
  <div class="head">
    <p class="kicker">報告書（PDF）でお届けします</p>
    <p class="h1">結果は、4段階でお知らせします</p>
  </div>
  <div class="grid">
    <div class="card st ok"><div class="top"><span class="sym">◎</span><span class="lb">対応済み</span></div>
      <p class="ds">今回の修正版でした。今回の件の更新は、必要ありません。</p></div>
    <div class="card st up"><div class="top"><span class="sym">△</span><span class="lb">更新が必要</span></div>
      <p class="ds">修正版より前の版です。更新をおすすめします。</p></div>
    <div class="card st eol"><div class="top"><span class="sym">！</span><span class="lb">サポート終了の版</span></div>
      <p class="ds">公式の更新が出ない版です。早めの切り替えをおすすめします。</p></div>
    <div class="card st chk"><div class="top"><span class="sym">？</span><span class="lb">要確認</span></div>
      <p class="ds">番号が確認できない・判断できないとき。確認先と問い合わせの文例をお渡しします。</p></div>
  </div>
  <div class="vers"><span class="k">今回の修正版</span><span class="v">8.5.12 ／ 8.4.27 ／ 8.3.36 ／ 8.2.35</span></div>
  <p class="fine">PHPを使っていないサイトは「対象外」とお伝えします。</p>
  <div class="brand"><img src="../../../../assets/images/logo-mark.png" alt=""><span>福祉ITパートナー</span><span class="sub">専門用語を使わずにご報告します</span></div>
</div>
</body>
</html>

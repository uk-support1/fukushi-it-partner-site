<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>03 報告書のサンプル（更新が必要）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .canvas { padding: 0; }
  .page { position: absolute; left: 102px; top: 56px; width: 580px; height: 820px; border-radius: 14px; overflow: hidden; background: #fff;
    box-shadow: 0 12px 36px rgba(31, 77, 60, .22); border: 2px solid #dfe6e2; }
  .page img { display: block; width: 100%; height: auto; }
  .right { position: absolute; left: 722px; top: 64px; width: 396px; }
  .h1 { margin-top: 22px; font-size: 62px; line-height: 1.25; }
  .h1 .mk { color: var(--st-c); }
  .points { margin-top: 26px; list-style: none; }
  .points li { display: flex; align-items: flex-start; gap: 14px; font-size: 31px; font-weight: 800; color: var(--green-900); line-height: 1.4; margin-bottom: 10px; }
  .points .ic { width: 38px; height: 38px; flex: none; margin-top: 3px; color: var(--green-700); stroke-width: 5; }
  .thumbs { margin-top: 18px; }
  .thumbs .cap { font-size: 26px; font-weight: 800; color: var(--text-600); margin-bottom: 10px; }
  .thumbs .row { display: flex; gap: 12px; }
  .thumbs .t { width: 122px; height: 173px; border-radius: 6px; overflow: hidden; border: 2px solid #dfe6e2; background: #fff; box-shadow: 0 4px 12px rgba(31,77,60,.12); }
  .thumbs .t img { display: block; width: 100%; height: auto; }
  .note { margin-top: 12px; font-size: 25px; color: var(--text-600); }
  .brand { bottom: 40px; }
</style>
</head>
<body>
<script src="icons.js"></script>
<div class="canvas" style="--st-c: var(--st-update)">
  <div class="page"><img src="sample-pages/update-1.png" alt=""></div>
  <div class="right">
    <p class="eyebrow">報告書のサンプル</p>
    <p class="h1"><span class="mk">△ 更新が必要</span><br>だった場合</p>
    <ul class="points">
      <li><svg class="ic"><use href="#i-check"/></svg>番号と判定が<br>ひと目で分かる</li>
      <li><svg class="ic"><use href="#i-check"/></svg>やることが<br>順番に書いてある</li>
      <li><svg class="ic"><use href="#i-check"/></svg>更新するときの<br>注意つき</li>
    </ul>
    <div class="thumbs"><p class="cap">全4ページ（PDF）</p>
      <div class="row">
        <div class="t"><img src="sample-pages/update-2.png" alt=""></div>
        <div class="t"><img src="sample-pages/update-3.png" alt=""></div>
        <div class="t"><img src="sample-pages/update-4.png" alt=""></div>
      </div>
    </div>
    <p class="note">※架空の例です</p>
  </div>
  <div class="brand"><img src="../../../../assets/images/logo-mark.png" alt=""><span>福祉ITパートナー</span></div>
</div>
</body>
</html>

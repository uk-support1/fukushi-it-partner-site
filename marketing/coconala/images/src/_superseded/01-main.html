<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>01 メイン画像</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css">
<style>
  .label {
    align-self: flex-start; margin-top: 8px;
    border: 3px solid rgba(255,255,255,.7); color: var(--white);
    font-size: 30px; font-weight: 700; padding: 8px 28px; border-radius: 999px; letter-spacing: .04em;
  }
  .copy { margin-top: 58px; position: relative; z-index: 2; }
  .t1 { font-size: 100px; font-weight: 800; line-height: 1.12; letter-spacing: .01em; }
  .t2 { margin-top: 12px; font-size: 62px; font-weight: 800; line-height: 1.3; color: #ffc89a; }
  .t3 { margin-top: 24px; font-size: 38px; font-weight: 700; line-height: 1.5; color: rgba(255,255,255,.92); }
  .checks { margin-top: 54px; list-style: none; position: relative; z-index: 2; }
  .checks li { display: flex; align-items: center; gap: 16px; font-size: 38px; font-weight: 700; margin-bottom: 16px; }
  .checks .ic { color: #ffc89a; width: 46px; height: 46px; stroke-width: 5; }
  .hero { position: absolute; right: 102px; top: 214px; width: 322px; height: 306px; }
  .price {
    position: absolute; right: 102px; bottom: 126px; width: 360px;
    background: var(--white); color: var(--green-900); border-radius: 26px; padding: 22px 28px 20px;
    border-top: 10px solid var(--orange-500); text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.22);
  }
  .price .a { font-size: 32px; font-weight: 700; color: var(--text-600); }
  .price .b { font-size: 84px; font-weight: 800; line-height: 1.05; letter-spacing: -.01em; white-space: nowrap; }
  .price .b small { font-size: 40px; font-weight: 800; margin-left: 2px; }
  .price .c { font-size: 25px; font-weight: 500; color: var(--text-600); }
</style>
</head>
<body>
<script src="../icons.js"></script>
<div class="canvas dark">
  <p class="label">福祉事業所・小規模事業者の方へ</p>

  <div class="copy">
    <p class="t1">PHPの脆弱性</p>
    <p class="t2">うちのサイトは対象？</p>
    <p class="t3">確認して、報告書でお届けします</p>
  </div>

  <ul class="checks">
    <li><svg class="ic"><use href="#i-check-circle"/></svg>ログイン情報は不要</li>
    <li><svg class="ic"><use href="#i-check-circle"/></svg>専門知識は不要</li>
    <li><svg class="ic"><use href="#i-check-circle"/></svg>更新は、必要な方だけ</li>
  </ul>

  <!-- サイト（窓）＋警告（オレンジ）＋盾とチェック（白）の組み合わせ -->
  <svg class="hero decor" viewBox="0 0 400 380" aria-hidden="true">
    <rect x="10" y="34" width="304" height="232" rx="24" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.55)" stroke-width="6"/>
    <path d="M10 92h304" stroke="rgba(255,255,255,.55)" stroke-width="6"/>
    <circle cx="46" cy="63" r="8" fill="rgba(255,255,255,.55)"/>
    <circle cx="74" cy="63" r="8" fill="rgba(255,255,255,.55)"/>
    <circle cx="102" cy="63" r="8" fill="rgba(255,255,255,.55)"/>
    <rect x="42" y="124" width="150" height="15" rx="7.5" fill="rgba(255,255,255,.3)"/>
    <rect x="42" y="154" width="210" height="15" rx="7.5" fill="rgba(255,255,255,.3)"/>
    <rect x="42" y="184" width="118" height="15" rx="7.5" fill="rgba(255,255,255,.3)"/>
    <rect x="42" y="216" width="86" height="30" rx="10" fill="rgba(255,255,255,.18)"/>
    <!-- 警告（オレンジ）：窓の右上 -->
    <circle cx="316" cy="44" r="36" fill="#e8965a"/>
    <path d="M316 28v22" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
    <circle cx="316" cy="62" r="5.5" fill="#fff"/>
    <!-- 盾（白）：右下に重ねる -->
    <path d="M262 150l92 34v78c0 58-44 96-92 114-48-18-92-56-92-114v-78z" fill="#fff"/>
    <path d="M222 266l30 30 54-60" fill="none" stroke="#1f4d3c" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="price">
    <p class="a">確認だけ</p>
    <p class="b"><span data-basic>2,000</span><small>円</small></p>
    <p class="c">（税込）</p>
  </div>

  <div class="brand"><img src="../../../../../assets/images/logo-mark.png" alt=""><span>福祉ITパートナー</span></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const basic = q.get('basic') || '2,000';
  document.querySelectorAll('[data-basic]').forEach(e => e.textContent = basic);
</script>
</body>
</html>

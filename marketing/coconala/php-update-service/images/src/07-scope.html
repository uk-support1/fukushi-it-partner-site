<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>07 お受けする範囲（PHP更新代行）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../images/src/common.css">
<style>
  .h1 { font-size: 68px; }
  .cols { margin-top: 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .col { padding: 28px 26px 22px; border-top: 12px solid var(--c); }
  .col .hd { display: flex; align-items: center; gap: 16px; }
  .col .ico { width: 66px; height: 66px; }
  .col .ic { width: 36px; height: 36px; }
  .col .ttl { font-size: 38px; font-weight: 800; color: var(--c); line-height: 1.2; }
  .col ul { margin-top: 20px; list-style: none; }
  .col li { display: flex; align-items: flex-start; gap: 12px; font-size: 31px; font-weight: 700; color: var(--text-900); line-height: 1.38; margin-bottom: 14px; }
  .col li .ic { width: 32px; height: 32px; margin-top: 4px; flex: none; color: var(--c); stroke-width: 5; }
  .col li small { display: block; font-size: 24px; font-weight: 500; color: var(--text-600); }
  .yes { --c: var(--st-ok); } .no { --c: var(--st-eol); }
  .help {
    margin-top: 24px; display: flex; align-items: center; gap: 18px;
    background: #e6ecf1; border-radius: 24px; padding: 20px 28px;
  }
  .help .ic { width: 46px; height: 46px; color: var(--st-check); flex: none; }
  .help .t { font-size: 29px; font-weight: 800; color: #3f5163; line-height: 1.42; }
</style>
</head>
<body>
<script src="../../../images/src/icons.js"></script>
<div class="canvas">
  <p class="eyebrow">お受けする範囲</p>
  <p class="h1">できること・<em>しないこと</em></p>

  <div class="cols">
    <div class="card col yes">
      <div class="hd"><span class="ico g"><svg class="ic"><use href="#i-check-circle"/></svg></span><p class="ttl">基本に含みます</p></div>
      <ul>
        <li><svg class="ic"><use href="#i-check"/></svg>事前確認</li>
        <li><svg class="ic"><use href="#i-check"/></svg>バックアップ</li>
        <li><svg class="ic"><use href="#i-check"/></svg>互換性の確認</li>
        <li><svg class="ic"><use href="#i-check"/></svg>PHPの更新</li>
        <li><svg class="ic"><use href="#i-check"/></svg>動作確認・報告書</li>
      </ul>
    </div>
    <div class="card col no">
      <div class="hd"><span class="ico r"><svg class="ic"><use href="#i-ban"/></svg></span><p class="ttl">含みません</p></div>
      <ul>
        <li><svg class="ic"><use href="#i-ban"/></svg><span>不具合の修正・改修<small>先に金額をご報告します</small></span></li>
        <li><svg class="ic"><use href="#i-ban"/></svg><span>ウイルスの除去<small>攻撃を受けたかの調査も</small></span></li>
        <li><svg class="ic"><use href="#i-ban"/></svg><span>専用サーバー・VPS<small>WordPress以外も</small></span></li>
      </ul>
    </div>
  </div>

  <div class="help"><svg class="ic"><use href="#i-server"/></svg><p class="t">PHPの版を切り替えられ、<br>元に戻せるサーバーが対象です。</p></div>

  <div class="brand"><img src="../../../../../assets/images/logo-mark.png" alt=""><span>福祉ITパートナー</span><span class="sub">福祉事業所・団体専門</span></div>
</div>
</body>
</html>

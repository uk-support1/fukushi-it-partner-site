<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>05 作業完了報告書のサンプル（PHP更新代行）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../images/src/common.css">
<style>
  .h1 { font-size: 66px; margin-top: 20px; }
  .paper { position: relative; margin-top: 28px; padding: 30px 38px 22px; border: 2px solid #e4ecdf; }
  .paper .hd { display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid var(--green-100); padding-bottom: 14px; }
  .paper .hd .ttl { font-size: 38px; font-weight: 900; color: var(--green-900); }
  .stamp {
    display: flex; align-items: center; gap: 10px; background: var(--st-ok); color: var(--white);
    border-radius: 999px; padding: 6px 26px 8px; font-size: 30px; font-weight: 800;
  }
  .stamp .ic { width: 32px; height: 32px; stroke-width: 5; }
  .ver { display: flex; align-items: center; justify-content: center; gap: 26px; margin: 26px 0 18px; }
  .ver .lbl { font-size: 28px; font-weight: 700; color: var(--text-600); display: block; text-align: center; }
  .ver .no { font-size: 72px; font-weight: 900; letter-spacing: -.01em; display: block; text-align: center; line-height: 1.1; }
  .ver .old .no { color: var(--text-600); }
  .ver .new .no { color: var(--green-900); }
  .ver .ic { width: 56px; height: 56px; color: var(--orange-600); stroke-width: 5; }
  .list { list-style: none; margin-top: 8px; }
  .list li { display: flex; align-items: center; gap: 16px; font-size: 33px; font-weight: 700; color: var(--text-900); padding: 15px 0; border-top: 2px dashed #e4ecdf; }
  .list li .ic { width: 32px; height: 32px; color: var(--st-ok); stroke-width: 5; flex: none; }
  .list li small { margin-left: auto; font-size: 26px; font-weight: 500; color: var(--text-600); white-space: nowrap; }
  .sample { margin-top: 6px; text-align: right; font-size: 24px; font-weight: 700; color: var(--st-eol); }
</style>
</head>
<body>
<script src="../../../images/src/icons.js"></script>
<div class="canvas">
  <p class="eyebrow">作業完了報告書のサンプル</p>
  <p class="h1">何をしたか、<em>書面</em>でお届け</p>

  <div class="card paper">
    <div class="hd"><span class="ttl">作業完了報告書</span><span class="stamp"><svg class="ic"><use href="#i-check"/></svg>更新を完了</span></div>
    <div class="ver">
      <div class="old"><span class="lbl">更新前</span><span class="no">PHP 8.1</span></div>
      <svg class="ic"><use href="#i-arrow-right"/></svg>
      <div class="new"><span class="lbl">更新後</span><span class="no">PHP 8.3</span></div>
    </div>
    <ul class="list">
      <li><svg class="ic"><use href="#i-check"/></svg>バックアップ<small>取得・中身まで確認</small></li>
      <li><svg class="ic"><use href="#i-check"/></svg>互換性の確認<small>プラグイン12件</small></li>
      <li><svg class="ic"><use href="#i-check"/></svg>表示・管理画面・フォーム<small>問題なし</small></li>
      <li><svg class="ic"><use href="#i-check"/></svg>元に戻す方法<small>手順つき</small></li>
    </ul>
    <p class="sample">※架空の例です</p>
  </div>

  <div class="brand"><img src="../../../../../assets/images/logo-mark.png" alt=""><span>福祉ITパートナー</span><span class="sub">福祉事業所・団体専門</span></div>
</div>
</body>
</html>

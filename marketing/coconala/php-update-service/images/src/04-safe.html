<!doctype html>
<html lang="ja">
<head>

<link rel="stylesheet" href="../../../images/src/common.css">
<style>
  .h1 { font-size: 70px; }
  .rows { margin-top: 36px; list-style: none; display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; align-items: center; gap: 26px; padding: 24px 34px 24px 26px; }
  .row .ico { width: 96px; height: 96px; }

  .row .no { font-size: 26px; font-weight: 800; color: var(--orange-600); letter-spacing: .04em; }

  .row .t small { display: block; margin-top: 2px; font-size: 26px; font-weight: 500; color: var(--text-600); }
  .note {

  .note .ic { width: 46px; height: 46px; color: var(--st-check); flex: none; }

<script src="../../../images/src/icons.js"></script>
<div class="canvas">

  <ul class="rows">
    <li class="card row"><span class="ico gd"><svg class="ic"><use href="#i-download"/></svg></span>

  </ul>

  <div class="note"><svg class="ic"><use href="#i-question"/></svg><p class="t">元に戻せないサーバーは、先にお伝えして<br>お受けしません。</p></div>

  <div class="brand"><img src="../../../../../assets/images/logo-mark.png" alt=""><span>福祉ITパートナー</span><span class="sub">福祉事業所・団体専門</span></div>

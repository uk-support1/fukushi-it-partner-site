<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>03 作業の流れ（PHP更新代行）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../images/src/common.css">
<style>
  .h1 { font-size: 72px; }
  .grid { margin-top: 30px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .step { position: relative; padding: 24px 14px 18px; text-align: center; }
  .step .ico { width: 92px; height: 92px; margin: 0 auto; }
  .step .ic { width: 50px; height: 50px; }
  .step .no {
    position: absolute; left: 16px; top: 16px; width: 48px; height: 48px; border-radius: 50%;
    background: var(--green-900); color: var(--white); font-size: 28px; font-weight: 800; line-height: 48px;
  }
  .step .lb { margin-top: 12px; font-size: 34px; font-weight: 800; line-height: 1.32; color: var(--green-900); }
  .step.key { border: 4px solid var(--orange-500); }
  .step.key .no { background: var(--orange-600); }
  .assure {
    margin-top: 24px; display: flex; align-items: center; gap: 20px;
    background: var(--green-100); border-radius: 24px; padding: 18px 32px;
  }
  .assure .ic { width: 50px; height: 50px; color: var(--green-700); flex: none; }
  .assure .t { font-size: 31px; font-weight: 800; color: var(--green-900); line-height: 1.4; }
</style>
</head>
<body>
<script src="../../../images/src/icons.js"></script>
<div class="canvas">
  <p class="eyebrow">作業の流れ</p>
  <p class="h1">6つの<em>ステップ</em>で進めます</p>

  <div class="grid">
    <div class="card step"><span class="no">1</span><span class="ico g"><svg class="ic"><use href="#i-search"/></svg></span><p class="lb">事前確認</p></div>
    <div class="card step key"><span class="no">2</span><span class="ico od"><svg class="ic"><use href="#i-download"/></svg></span><p class="lb">バックアップ</p></div>
    <div class="card step"><span class="no">3</span><span class="ico g"><svg class="ic"><use href="#i-clipboard"/></svg></span><p class="lb">互換性の確認</p></div>
    <div class="card step"><span class="no">4</span><span class="ico g"><svg class="ic"><use href="#i-update"/></svg></span><p class="lb">PHPの更新</p></div>
    <div class="card step"><span class="no">5</span><span class="ico g"><svg class="ic"><use href="#i-site"/></svg></span><p class="lb">動作確認</p></div>
    <div class="card step"><span class="no">6</span><span class="ico g"><svg class="ic"><use href="#i-doc"/></svg></span><p class="lb">報告書を<br>お届け</p></div>
  </div>

  <div class="assure"><svg class="ic"><use href="#i-shield-check"/></svg><p class="t">サイトを変更するのは、PHPの更新から。<br>それまでは、確認とバックアップです。</p></div>

  <div class="brand"><img src="../../../../../assets/images/logo-mark.png" alt=""><span>福祉ITパートナー</span><span class="sub">福祉事業所・団体専門</span></div>
</div>
</body>
</html>

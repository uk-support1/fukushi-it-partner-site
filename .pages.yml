media:
  input: assets/images/cms-uploads
  output: /assets/images/cms-uploads

content:
  - name: articles
    label: "お知らせ・コラム"
    description: "公式サイトの「お知らせ・コラム」ページに公開する記事を管理します。保存すると自動的にサイトへ反映されます。"
    type: collection
    path: content/articles
    filename: "{fields.slug}.md"
    format: yaml-frontmatter
    extension: md
    fields:
      - name: type
        label: "記事種別"
        description: "記事の分類です。一覧ページでの表示バッジは、下の「カテゴリ表示（任意）」が空欄の場合にここから自動で決まります。"
        type: select
        required: true
        options:
          values:
            - name: news
              label: "お知らせ"
            - name: column
              label: "コラム"
        default: "column"

      - name: category_label
        label: "カテゴリ表示（任意）"
        description: "一覧・記事ページのバッジに表示する文言を個別に指定したい場合に入力してください（例：「AI活用」）。空欄の場合は「記事種別」から自動で決まります。"
        type: string
        required: false

      - name: title
        label: "タイトル"
        description: "記事のタイトルです。ページの見出し（H1）や検索結果のタイトルにそのまま使われます。"
        type: string

      - name: date
        label: "投稿日"
        description: "記事一覧の並び順（新しい順）に使われます。"
        type: date

      - name: image
        label: "メイン画像"
        description: "記事冒頭に表示される画像です。一覧のサムネイルやSNSシェア時の画像としても使われます。"
        type: image

      - name: image_alt
        label: "画像の説明（任意）"
        description: "画像の内容を簡単に入力してください。例：「施設の外観」「明るい居室の様子」\n※検索エンジンが画像の内容を理解するために使われ、SEO対策にもつながります。"
        type: string
        required: false

      - name: body
        label: "本文"
        description: "太字・見出し・リンク・箇条書き・画像などを挿入できます。"
        type: rich-text

      - name: published
        label: "公開する"
        description: "オフのままだと下書きとして保存され、サイトには表示されません。"
        type: boolean
        default: false

      - name: description
        label: "SEO用説明文"
        description: "検索結果やSNSでシェアされた際に表示される説明文です。120字程度を推奨します。"
        type: text

      - name: slug
        label: "URL（スラッグ）"
        description: "記事ページのURL（例：blog/このスラッグ.html）に使われます。通常は変更しないでください。保存後に変更すると、記事のURLが変わり、検索結果や他ページ・SNSからのリンクが無効になるおそれがあります。"
        type: string

      - name: related
        label: "関連記事（任意・最大2件）"
        description: "記事の下部に「関連記事」として表示したい記事を、タイトルで検索して選んでください。1件だけでも構いません。空欄のままにした場合は、同じカテゴリの記事を優先して自動的に表示されます。"
        type: reference
        required: false
        options:
          collection: articles
          multiple: true
          max: 2
          search: "title"
          value: "{fields.slug}"
          label: "{fields.title}"

      - name: excerpt
        label: "一覧用の抜粋（任意）"
        description: "記事一覧に表示する紹介文です。空欄の場合は本文の冒頭が自動的に使われます。"
        type: text
        required: false

      - name: cta_heading
        label: "記事下部の見出し（任意）"
        description: "記事の一番下に表示する相談案内の見出しです。空欄の場合は「まずはお気軽にご相談ください。」が使われます。"
        type: string
        required: false

      - name: cta_button_text
        label: "記事下部のボタン文言（任意）"
        description: "記事の一番下に表示するボタンの文言です。空欄の場合は「無料相談はこちら」が使われます。"
        type: string
        required: false
